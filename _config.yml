title: "Wanjaaro — Free Construction Calculators"
description: "Free browser-based construction calculators for concrete, earthwork, framing, roofing, masonry, finishes, building services, and project estimating."
permalink: /:title
baseurl: ""
url: "https://wanjaaro.com"

markdown: kramdown
kramdown:
  input: Kramdown

plugins:
  - jekyll-sitemap
  - jemoji
  - jekyll-toc
  - jekyll-redirect-from

toc:
  min_level: 2
  max_level: 6
  list_class: toc__list
  sublist_class: toc__sublist

exclude: ["node_modules", "gulpfile.js", "package.json", "yarn.lock"]
