title: "Wanjaaro — Benchmark, Reflex & Skill Tests"
description: "Free browser-based human benchmark tests: reflex speed, aim trainer, memory, typing, timing, perception, and cognitive puzzles. Pure client-side with no sign-ups."
permalink: /:title
baseurl: ""
url: "https://wanjaaro.com"

markdown: kramdown
kramdown:
  input: Kramdown

plugins:
  - jekyll-sitemap
  - jemoji
  - jekyll-toc
  - jekyll-redirect-from

toc:
  min_level: 2
  max_level: 6
  list_class: toc__list
  sublist_class: toc__sublist

exclude: ["node_modules", "gulpfile.js", "package.json", "yarn.lock"]
