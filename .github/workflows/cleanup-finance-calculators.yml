name: Rebuild Construction Foundation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove old calculator pages and rebuild foundation data
        shell: bash
        run: |
          set -euo pipefail

          # Remove every root Markdown page that uses the old calculator layout
          # or exposes a calculator tool_id.
          for file in *.md; do
            [ -f "$file" ] || continue
            [ "$file" = "index.md" ] && continue
            [ "$file" = "about-us.md" ] && continue
            if grep -qE '^(layout: tool|tool_id:)' "$file"; then
              rm -f "$file"
            fi
          done

          # Remove old finance category hubs if present.
          for file in growth.md retirement.md mortgage.md debt.md insurance.md tax.md budgeting.md investing.md savings.md; do
            rm -f "$file"
          done

          cat > _data/tools.yml <<'EOF'
# Construction calculator registry.
# Individual calculators will be added as standalone pages during the rebuild.
[]
EOF

          cat > _data/categories.yml <<'EOF'
# Construction calculator navigation categories.
concrete-foundations:
  name: Concrete & Foundations
  description: Concrete quantities, slabs, footings, piers, rebar, and foundation materials.

earthwork-site:
  name: Earthwork & Site Work
  description: Excavation, grading, aggregate, drainage, soil, and site preparation calculations.

framing-structures:
  name: Framing & Structures
  description: Lumber, studs, joists, rafters, sheathing, decks, stairs, and structural quantities.

roofing-exterior:
  name: Roofing & Exterior
  description: Roof area, shingles, underlayment, siding, gutters, and exterior material calculations.

masonry:
  name: Masonry & Block
  description: Brick, block, mortar, wall area, and masonry material calculations.

finishes:
  name: Drywall & Finishes
  description: Drywall, plaster, paint, tile, flooring, insulation, and finish-material calculations.

trades:
  name: Plumbing, Electrical & HVAC
  description: Practical building-service calculations for plumbing, electrical, ventilation, and HVAC work.

estimating:
  name: Estimating & Project Costs
  description: Material quantities, waste, labor, project costs, and construction estimating tools.
EOF

          cat > index.md <<'EOF'
