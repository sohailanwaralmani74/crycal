          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "rebuild: reset site for construction calculators" || exit 0
          git push

      - name: Remove temporary cleanup workflow
        if: success()
        shell: bash
        run: |
          git rm -f .github/workflows/cleanup-finance-calculators.yml
          git commit -m "chore: remove temporary rebuild workflow"
          git push
