<script>
(function(){
  var btn=document.getElementById('hamburger'), drawer=document.getElementById('mobileDrawer'), overlay=document.getElementById('overlay');
  if(!btn||!drawer||!overlay)return;
  function close(){btn.classList.remove('active');btn.setAttribute('aria-expanded','false');drawer.classList.remove('active');drawer.setAttribute('aria-hidden','true');drawer.setAttribute('inert','');overlay.classList.remove('active');document.body.style.overflow='';}
  function open(){btn.classList.add('active');btn.setAttribute('aria-expanded','true');drawer.classList.add('active');drawer.setAttribute('aria-hidden','false');drawer.removeAttribute('inert');overlay.classList.add('active');document.body.style.overflow='hidden';}
  btn.addEventListener('click',function(){drawer.classList.contains('active')?close():open();}); overlay.addEventListener('click',close); document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
})();
</script>
